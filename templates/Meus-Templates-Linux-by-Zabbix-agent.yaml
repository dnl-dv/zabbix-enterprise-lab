zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 1f695926004b49159e2b13fe4ea5363e
      name: 'Meus Templates'
  templates:
    - uuid: 2ca01c578ea142c69ae20a022c1fc5c5
      template: 'Meus Templates Linux by Zabbix agent'
      name: 'Meus Templates Linux by Zabbix agent'
      description: |
        Este é um modelo oficial do Linux (Linux). Ele requer o Zabbix agent 7.0 ou mais recente.
        
        Notas sobre a descoberta de sistemas de arquivos (FS - Filesystem):
        
        O sistema de arquivos ext4/3/2 reserva espaço para uso privilegiado, tipicamente configurado em 5% por padrão.
        
        O BTRFS aloca um padrão de 10% do volume para suas próprias necessidades.
        
        Para mitigar potenciais desastres, os gatilhos (triggers) de uso do sistema de arquivos (FS) são baseados no espaço máximo disponível.
        
        Fórmula de utilização: 'pused = 100 - 100 * (available / total - free + available)'
        
        O gráfico de utilização do sistema de arquivos (FS), derivado de protótipos de gráficos (graph prototypes), reflete o espaço reservado do sistema de arquivos (FS) como a diferença entre o espaço usado e o disponível a partir do volume total.
        
        Você pode discutir este modelo ou deixar seu feedback em nosso fórum https://www.zabbix.com/forum/zabbix-suggestions-and-feedback/387225-discussion-thread-for-official-zabbix-template-for-linux
        
        Gerado pela ferramenta de modelo oficial do Zabbix "Templator"
      groups:
        - name: 'Meus Templates'
      items:
        - uuid: f07de52aa1ca4d699add9d0be5633e65
          name: 'Zabbix Agent Ping'
          key: agent.ping
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
            - tag: component
              value: system
        - uuid: 9535503d481346c59e2194129d91a966
          name: 'Number of processes'
          key: proc.num
          tags:
            - tag: component
              value: system
        - uuid: 64f6e558bc29479e9208e095b93f40cd
          name: 'Load average (1m avg)'
          key: 'system.cpu.load[all,avg1]'
          value_type: FLOAT
          description: 'Calculated as the system CPU load divided by the number of CPU cores.'
          tags:
            - tag: component
              value: cpu
        - uuid: 10508b11644f45b3928269d43f79b14c
          name: 'Load average (5m avg)'
          key: 'system.cpu.load[all,avg5]'
          value_type: FLOAT
          description: 'Calculated as the system CPU load divided by the number of CPU cores.'
          tags:
            - tag: component
              value: cpu
        - uuid: 94976743929d434f81982e3d86af27fc
          name: 'Load average (15m avg)'
          key: 'system.cpu.load[all,avg15]'
          value_type: FLOAT
          description: 'Calculated as the system CPU load divided by the number of CPU cores.'
          tags:
            - tag: component
              value: cpu
        - uuid: cb91a9ece3fe47bbb6d9f381e3c21b9c
          name: 'Number of CPUs'
          key: system.cpu.num
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: cpu
        - uuid: c45a9d431a1648d5869f9a562fa439bf
          name: 'CPU utilization'
          type: DEPENDENT
          key: system.cpu.util
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Utilização da CPU expressa em %.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return (100 - value)'
          master_item:
            key: 'system.cpu.util[,idle]'
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: 35ea8ef4d1924acf8feb1455779fffca
              expression: 'min(/Meus Templates Linux by Zabbix agent/system.cpu.util,5m)>{$CPU.UTIL.CRIT}'
              name: 'Linux: Alto uso da CPU'
              event_name: 'Linux: Alto uso da CPU (over {$CPU.UTIL.CRIT}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'A utilização da CPU está muito alta. O sistema pode estar lento para responder.'
              dependencies:
                - name: 'Linux: Load average is too high'
                  expression: |
                    min(/Meus Templates Linux by Zabbix agent/system.cpu.load[all,avg1],5m)/last(/Meus Templates Linux by Zabbix agent/system.cpu.num)>{$LOAD_AVG_PER_CPU.MAX.WARN}
                    and last(/Meus Templates Linux by Zabbix agent/system.cpu.load[all,avg5])>0
                    and last(/Meus Templates Linux by Zabbix agent/system.cpu.load[all,avg15])>0
              tags:
                - tag: scope
                  value: performance
        - uuid: 3527ccffd9af4123b5b3757f4756ecc2
          name: 'CPU idle time'
          key: 'system.cpu.util[,idle]'
          value_type: FLOAT
          units: '%'
          description: 'Tempo que a CPU passou ociosa.'
          tags:
            - tag: class
              value: os
            - tag: component
              value: cpu
            - tag: target
              value: linux
        - uuid: 092626c5aca348c28782404930f007cd
          name: 'CPU (User)'
          key: 'system.cpu.util[,user]'
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: cpu
        - uuid: 3226f9765f4b48458528f2b275e52468
          name: 'Free swap space'
          key: 'system.swap.size[,free]'
          units: B
          description: 'The free space of the swap volume/file expressed in bytes.'
          tags:
            - tag: component
              value: memory
            - tag: component
              value: storage
        - uuid: 3282ac438eef437192e3c1ff499beec3
          name: 'Free swap space in %'
          key: 'system.swap.size[,pfree]'
          value_type: FLOAT
          units: '%'
          description: 'The free space of the swap volume/file expressed in %.'
          tags:
            - tag: component
              value: memory
            - tag: component
              value: storage
        - uuid: a4c1daf5fd8a4ef69eeb8ee097d9c9ec
          name: 'Total swap space'
          key: 'system.swap.size[,total]'
          units: B
          description: 'The total space of the swap volume/file expressed in bytes.'
          tags:
            - tag: component
              value: memory
            - tag: component
              value: storage
        - uuid: 04f5b6a930674b8aa5e38b2b37321181
          name: 'System uptime'
          key: system.uptime
          delay: 30s
          trends: '0'
          units: uptime
          description: 'The system uptime expressed in the following format: "N days, hh:mm:ss".'
          tags:
            - tag: component
              value: system
        - uuid: d64aae6d2ca641d391b29ee3111b14e3
          name: 'Checksum of /etc/passwd'
          key: 'vfs.file.cksum[/etc/passwd,sha256]'
          delay: 15m
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: security
        - uuid: 56bb3f33788f494aab1058e043dd5944
          name: 'Checksum of zabbix_agent2.conf'
          key: 'vfs.file.cksum[/etc/zabbix/zabbix_agent2.conf,sha256]'
          delay: 15m
          value_type: CHAR
          trends: '0'
          description: 'Monitoramente de integridade do arquivo /etc/zabbix/zabbix_agent2.conf.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: security
        - uuid: 9b4ad0a10c174bfea1b70695dbc91ee2
          name: 'Checksum of zabbix_agentd.conf'
          key: 'vfs.file.cksum[/etc/zabbix/zabbix_agentd.conf,sha256]'
          delay: 15m
          value_type: CHAR
          trends: '0'
          description: 'Monitoramente de integridade do arquivo /etc/zabbix/zabbix_agentd.conf.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: security
        - uuid: d3b404e71f7645738d72e46945f8efc4
          name: 'Free Space'
          key: 'vfs.fs.size[/,free]'
          units: B
          tags:
            - tag: component
              value: storage
        - uuid: 37518abbef4d48249a13c1d2b070223a
          name: 'Available memory'
          key: 'vm.memory.size[available]'
          units: B
          tags:
            - tag: component
              value: memory
        - uuid: 56bd2df4f2124637a4b52eafec404a35
          name: 'Available memory in %'
          key: 'vm.memory.size[pavailable]'
          value_type: FLOAT
          units: '%'
          description: 'The available memory as percentage of the total. See also Appendixes in Zabbix Documentation about parameters of the `vm.memory.size` item.'
          tags:
            - tag: component
              value: memory
        - uuid: 7450d1715e354d6db5f0464a9e79d7d8
          name: 'Total memory'
          key: 'vm.memory.size[total]'
          units: B
          description: 'Total memory expressed in bytes.'
          tags:
            - tag: component
              value: memory
        - uuid: 2ec66c6f28404d98b946dcbf104d6f40
          name: 'Memory utilization'
          type: DEPENDENT
          key: vm.memory.util
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'The percentage of used memory is calculated as `100-pavailable`.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return (100-value);'
          master_item:
            key: 'vm.memory.size[pavailable]'
          tags:
            - tag: component
              value: memory
      tags:
        - tag: class
          value: os
        - tag: target
          value: linux
      macros:
        - macro: '{$CPU.UTIL.CRIT}'
          value: '90'
          description: 'Critical threshold of CPU utilization expressed in %.'
        - macro: '{$LOAD_AVG_PER_CPU.MAX.WARN}'
          value: '1.5'
          description: 'The CPU load per core is considered sustainable. If necessary, it can be tuned.'
  triggers:
    - uuid: 13ab9e3e89f54b02b5078dcb7c2c09fd
      expression: |
        min(/Meus Templates Linux by Zabbix agent/system.cpu.load[all,avg1],5m)/last(/Meus Templates Linux by Zabbix agent/system.cpu.num)>{$LOAD_AVG_PER_CPU.MAX.WARN}
        and last(/Meus Templates Linux by Zabbix agent/system.cpu.load[all,avg5])>0
        and last(/Meus Templates Linux by Zabbix agent/system.cpu.load[all,avg15])>0
      name: 'Linux: Load average is too high'
      event_name: 'Linux: Load average is too high (per CPU load over {$LOAD_AVG_PER_CPU.MAX.WARN} for 5m)'
      opdata: 'Load averages(1m 5m 15m): ({ITEM.LASTVALUE1} {ITEM.LASTVALUE3} {ITEM.LASTVALUE4}), # of CPUs: {ITEM.LASTVALUE2}'
      priority: AVERAGE
      description: 'The load average per CPU is too high. The system may be slow to respond.'
      tags:
        - tag: scope
          value: capacity
        - tag: scope
          value: performance
