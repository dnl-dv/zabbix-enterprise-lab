name: Security & Secret Audit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Varrer segredos no histórico com Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar IPs expostos e chaves PSK nos arquivos atuais
        run: |
          echo "Verificando endereços IPv4 reais..."
          IP_MATCHES=$(git grep -I -nE '(^|[^0-9.])([0-9]{1,3}\.){3}[0-9]{1,3}([^0-9.]|$)' -- . ':!.github' \
            | grep -Ev '127\.0\.0\.1|0\.0\.0\.0|192\.0\.2\.|198\.51\.100\.|203\.0\.113\.|255\.255\.' || true)

          echo "Verificando possíveis chaves PSK (64 caracteres hexadecimais)..."
          PSK_MATCHES=$(git grep -I -nE '(^|[^0-9a-fA-F])[0-9a-fA-F]{64}([^0-9a-fA-F]|$)' -- . ':!.github' || true)

          if [ -n "$IP_MATCHES" ] || [ -n "$PSK_MATCHES" ]; then
            echo "❌ ALERTA: Encontrados potenciais IPs reais ou chaves PSK nos arquivos atuais:"
            [ -n "$IP_MATCHES" ] && echo "$IP_MATCHES"
            [ -n "$PSK_MATCHES" ] && echo "$PSK_MATCHES"
            exit 1
          else
            echo "✅ Nenhum IP real ou chave PSK detectado nos arquivos atuais."
          fi
